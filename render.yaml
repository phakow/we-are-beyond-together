services:
  - type: web
    name: re-mmogo-backend
    runtime: node
    repo: https://github.com/phakow/we-are-beyond-together
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://your-frontend-url.onrender.com





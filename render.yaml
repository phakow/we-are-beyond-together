# render.yaml
services:
  - type: web
    name: re-mmogo-backend
    runtime: node
    repo: https://github.com/phakow/we-are-beyond-together
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
